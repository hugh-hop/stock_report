<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>消除达人</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: #f5f5f5;
            position: relative;
            overflow: hidden;
        }

        .scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .scene.active {
            display: flex;
        }

        /* Start Scene */
        #start-scene {
            background: linear-gradient(135deg, #FF6B35 0%, #FF8C42 100%);
        }

        .logo {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .game-title {
            font-size: 2.5em;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 60px;
        }

        .btn {
            padding: 15px 50px;
            font-size: 1.3em;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: white;
            color: #FF6B35;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.3);
            color: white;
            font-size: 1em;
            padding: 12px 30px;
        }

        .btn-gift {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: white;
        }

        /* Level Select Scene */
        #level-select-scene {
            background: white;
        }

        .scene-header {
            width: 100%;
            padding: 15px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2em;
            font-weight: bold;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            overflow-y: auto;
            max-height: calc(100vh - 120px);
        }

        .level-item {
            aspect-ratio: 1;
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .level-item:hover:not(.locked) {
            transform: scale(1.05);
            border-color: #667eea;
        }

        .level-item.completed {
            background: linear-gradient(135deg, #4ECDC4 0%, #44A08D 100%);
            color: white;
            border: none;
        }

        .level-item.current {
            background: linear-gradient(135deg, #FF6B35 0%, #FF8C42 100%);
            color: white;
            border: none;
            animation: pulse 2s infinite;
        }

        .level-item.locked {
            background: #e0e0e0;
            color: #999;
            cursor: not-allowed;
        }

        .level-stars {
            font-size: 0.6em;
            margin-top: 2px;
        }

        /* Game Scene */
        #game-scene {
            background: white;
            padding: 0;
        }

        .game-header {
            width: 100%;
            padding: 15px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 15px;
            width: 100%;
        }

        .info-row {
            display: flex;
            justify-content: space-around;
            width: 100%;
            font-size: 1.1em;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .info-label {
            font-size: 0.8em;
            opacity: 0.8;
        }

        .info-value {
            font-size: 1.5em;
            font-weight: bold;
        }

        .timer {
            color: #FF6B35;
        }

        .coins {
            color: #FFD700;
        }

        #grid-container {
            display: grid;
            gap: 8px;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin: 20px;
        }

        .grid-item {
            width: 60px;
            height: 60px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .grid-item:hover:not(.eliminated) {
            transform: scale(1.1);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .grid-item.selected {
            transform: scale(1.15);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.5);
            border-color: #667eea;
        }

        .grid-item.hint {
            animation: hint 0.5s ease-in-out 3;
        }

        .grid-item.eliminated {
            opacity: 0;
            pointer-events: none;
        }

        @keyframes hint {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,53,0.7); }
            50% { box-shadow: 0 0 0 10px rgba(255,107,53,0); }
        }

        .props-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            width: 100%;
        }

        .prop-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .prop-btn:hover:not(.disabled) {
            transform: translateY(-3px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .prop-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .prop-icon {
            font-size: 2em;
        }

        .prop-count {
            font-size: 0.9em;
            font-weight: bold;
            color: #666;
        }

        /* Result Scene */
        #result-scene {
            background: white;
        }

        .result-content {
            text-align: center;
            padding: 40px 20px;
        }

        .result-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }

        .result-title {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
        }

        .result-stars {
            font-size: 3em;
            margin-bottom: 30px;
        }

        .result-stats {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .reward-section {
            margin: 30px 0;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 350px;
            width: 90%;
        }

        .modal-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        .modal-text {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* Ad Placeholder */
        .ad-placeholder {
            background: linear-gradient(135deg, #FF6B35 0%, #FF8C42 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            text-align: center;
        }

        .ad-placeholder-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }

        /* Loading */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            font-size: 3em;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 450px) {
            .grid-item {
                width: 50px;
                height: 50px;
                font-size: 2em;
            }

            .game-title {
                font-size: 2em;
            }

            .level-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Start Scene -->
        <div id="start-scene" class="scene active">
            <div class="logo">🎮</div>
            <h1 class="game-title">消除达人</h1>
            <button class="btn btn-primary" onclick="game.startGame()">开始游戏</button>
            <button class="btn btn-gift" onclick="game.showDailyGift()">📅 每日礼包</button>
            <button class="btn btn-secondary" onclick="game.showLevelSelect()">关卡选择</button>
        </div>

        <!-- Level Select Scene -->
        <div id="level-select-scene" class="scene">
            <div class="scene-header">
                <span onclick="game.showStart()">← 返回</span>
                <span>关卡选择</span>
                <span id="total-coins">💎 0</span>
            </div>
            <div id="level-grid" class="level-grid"></div>
        </div>

        <!-- Game Scene -->
        <div id="game-scene" class="scene">
            <div class="game-header">
                <span onclick="game.pauseGame()">⏸️</span>
                <span id="current-level">第 1 关</span>
                <span id="timer" class="timer">⏱️ 60</span>
            </div>
            <div class="game-info">
                <div class="info-row">
                    <div class="info-item">
                        <span class="info-label">目标</span>
                        <span class="info-value" id="target-pairs">8 对</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">进度</span>
                        <span class="info-value" id="progress">0/8</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">金币</span>
                        <span class="info-value coins" id="game-coins">💎 100</span>
                    </div>
                </div>
            </div>
            <div id="grid-container"></div>
            <div class="props-bar">
                <div class="prop-btn" id="prop-tips" onclick="game.useProp('tips')">
                    <span class="prop-icon">💡</span>
                    <span class="prop-count">×<span id="tips-count">3</span></span>
                </div>
                <div class="prop-btn" id="prop-remove" onclick="game.useProp('remove')">
                    <span class="prop-icon">🗑️</span>
                    <span class="prop-count">×<span id="remove-count">1</span></span>
                </div>
                <div class="prop-btn" id="prop-addtime" onclick="game.useProp('addtime')">
                    <span class="prop-icon">⏰</span>
                    <span class="prop-count">×<span id="addtime-count">2</span></span>
                </div>
            </div>
        </div>

        <!-- Result Scene -->
        <div id="result-scene" class="scene">
            <div class="result-content">
                <div class="result-icon" id="result-icon">🎉</div>
                <h2 class="result-title" id="result-title">通关成功！</h2>
                <div class="result-stars" id="result-stars">⭐⭐⭐</div>
                <div class="result-stats" id="result-stats">
                    <div class="stat-item">
                        <span>用时</span>
                        <span id="result-time">32秒</span>
                    </div>
                    <div class="stat-item">
                        <span>评价</span>
                        <span id="result-rating">完美</span>
                    </div>
                </div>
                <div class="reward-section" id="reward-section">
                    <button class="btn btn-primary" id="btn-double" onclick="game.claimDoubleReward()">
                        📺 看视频领双倍奖励
                    </button>
                    <button class="btn btn-secondary" onclick="game.claimReward()">
                        直接领取 <span id="single-reward">80</span> 💎
                    </button>
                </div>
                <button class="btn btn-primary" onclick="game.nextLevel()">下一关 →</button>
                <button class="btn btn-secondary" onclick="game.showLevelSelect()">返回选关</button>
                <button class="btn btn-secondary" onclick="game.showStart()">返回主页</button>
            </div>
        </div>
    </div>

    <!-- Daily Gift Modal -->
    <div id="gift-modal" class="modal">
        <div class="modal-content">
            <div class="modal-icon">🎁</div>
            <h3 class="modal-title">每日礼包</h3>
            <p class="modal-text">观看视频即可领取体力+道具！</p>
            <button class="btn btn-primary" onclick="game.claimDailyGift()">📺 观看视频领取</button>
            <button class="btn btn-secondary" onclick="game.closeModal('gift-modal')">稍后再说</button>
        </div>
    </div>

    <!-- Pause Modal -->
    <div id="pause-modal" class="modal">
        <div class="modal-content">
            <div class="modal-icon">⏸️</div>
            <h3 class="modal-title">游戏暂停</h3>
            <button class="btn btn-primary" onclick="game.resumeGame()">继续游戏</button>
            <button class="btn btn-secondary" onclick="game.retryLevel()">重新开始</button>
            <button class="btn btn-secondary" onclick="game.quitToLevelSelect()">退出关卡</button>
        </div>
    </div>

    <!-- Fail Modal -->
    <div id="fail-modal" class="modal">
        <div class="modal-content">
            <div class="modal-icon">😢</div>
            <h3 class="modal-title">时间耗尽！</h3>
            <p class="modal-text">再试一次，或者观看视频复活继续游戏！</p>
            <button class="btn btn-primary" onclick="game.watchAdRevive()">📺 看视频复活</button>
            <button class="btn btn-secondary" onclick="game.retryLevel()">重新开始</button>
            <button class="btn btn-secondary" onclick="game.quitToLevelSelect()">退出关卡</button>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="loading">
        <div class="spinner">⏳</div>
    </div>

    <script>
        class EliminationGame {
            constructor() {
                this.currentLevel = 1;
                this.gridSize = 4;
                this.iconTypes = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍉', '🍒', '🍌'];
                this.grid = [];
                this.selectedItem = null;
                this.targetPairs = 8;
                this.eliminatedPairs = 0;
                this.timeLimit = 60;
                this.timeLeft = 60;
                this.timer = null;
                this.isPlaying = false;
                
                this.data = this.loadData();
                this.initUI();
            }

            loadData() {
                const defaultData = {
                    highestLevel: 1,
                    coins: 100,
                    props: { tips: 3, remove: 1, addtime: 2 },
                    stars: {},
                    lastLoginDate: '',
                    loginDays: 0,
                    dailyGiftClaimed: false
                };
                
                try {
                    const saved = localStorage.getItem('eliminationGameData');
                    if (saved) {
                        return { ...defaultData, ...JSON.parse(saved) };
                    }
                } catch (e) {
                    console.log('Data load error:', e);
                }
                return defaultData;
            }

            saveData() {
                try {
                    localStorage.setItem('eliminationGameData', JSON.stringify(this.data));
                } catch (e) {
                    console.log('Data save error:', e);
                }
            }

            initUI() {
                this.updateCoinsDisplay();
                this.checkDailyLogin();
            }

            checkDailyLogin() {
                const today = new Date().toISOString().split('T')[0];
                if (this.data.lastLoginDate !== today) {
                    const yesterday = new Date();
                    yesterday.setDate(yesterday.getDate() - 1);
                    const yesterdayStr = yesterday.toISOString().split('T')[0];
                    
                    if (this.data.lastLoginDate === yesterdayStr) {
                        this.data.loginDays++;
                    } else {
                        this.data.loginDays = 1;
                    }
                    
                    this.data.lastLoginDate = today;
                    this.data.dailyGiftClaimed = false;
                    this.saveData();
                }
            }

            showScene(sceneId) {
                document.querySelectorAll('.scene').forEach(scene => {
                    scene.classList.remove('active');
                });
                document.getElementById(sceneId).classList.add('active');
            }

            showStart() {
                this.showScene('start-scene');
            }

            showLevelSelect() {
                this.renderLevelGrid();
                this.updateCoinsDisplay();
                this.showScene('level-select-scene');
            }

            renderLevelGrid() {
                const grid = document.getElementById('level-grid');
                grid.innerHTML = '';
                
                for (let i = 1; i <= 100; i++) {
                    const item = document.createElement('div');
                    item.className = 'level-item';
                    
                    if (i > this.data.highestLevel) {
                        item.classList.add('locked');
                        item.innerHTML = '🔒';
                    } else {
                        const stars = this.data.stars[i] || 0;
                        if (i === this.data.highestLevel) {
                            item.classList.add('current');
                        } else if (stars > 0) {
                            item.classList.add('completed');
                        }
                        
                        item.innerHTML = `
                            <span>${i}</span>
                            <span class="level-stars">${'⭐'.repeat(stars)}</span>
                        `;
                        item.onclick = () => this.startLevel(i);
                    }
                    
                    grid.appendChild(item);
                }
            }

            showDailyGift() {
                if (!this.data.dailyGiftClaimed) {
                    document.getElementById('gift-modal').classList.add('active');
                } else {
                    alert('今日礼包已领取，明天再来吧！');
                }
            }

            async claimDailyGift() {
                this.closeModal('gift-modal');
                this.showLoading();
                
                await this.simulateAd();
                
                this.data.props.tips += 2;
                this.data.props.remove += 1;
                this.data.props.addtime += 1;
                this.data.coins += 50;
                this.data.dailyGiftClaimed = true;
                this.saveData();
                
                this.hideLoading();
                alert('恭喜获得：提示×2、移除×1、加时×1、金币×50！');
                this.updateCoinsDisplay();
            }

            getLevelConfig(level) {
                if (level <= 5) {
                    return { gridSize: 4, iconTypes: 4, timeLimit: 60, targetPairs: 8 };
                } else if (level <= 10) {
                    return { gridSize: 4, iconTypes: 5, timeLimit: 50, targetPairs: 10 };
                } else if (level <= 20) {
                    return { gridSize: 5, iconTypes: 6, timeLimit: 45, targetPairs: 15 };
                } else if (level <= 50) {
                    return { gridSize: 5, iconTypes: 7, timeLimit: 40, targetPairs: 18 };
                } else {
                    return { gridSize: 5, iconTypes: 8, timeLimit: 35, targetPairs: 20 };
                }
            }

            startGame() {
                this.startLevel(this.data.highestLevel);
            }

            startLevel(level) {
                this.currentLevel = level;
                const config = this.getLevelConfig(level);
                
                this.gridSize = config.gridSize;
                this.timeLimit = config.timeLimit;
                this.timeLeft = config.timeLimit;
                this.targetPairs = config.targetPairs;
                this.eliminatedPairs = 0;
                
                this.generateGrid(config.iconTypes);
                this.updateUI();
                this.startTimer();
                this.isPlaying = true;
                
                this.showScene('game-scene');
            }

            generateGrid(iconCount) {
                this.grid = [];
                const totalItems = this.gridSize * this.gridSize;
                const pairsNeeded = Math.ceil(totalItems / 2);
                
                const icons = [];
                for (let i = 0; i < pairsNeeded; i++) {
                    const iconType = i % iconCount;
                    icons.push(iconType);
                    icons.push(iconType);
                }
                
                while (icons.length < totalItems) {
                    const iconType = Math.floor(Math.random() * iconCount);
                    icons.push(iconType);
                    icons.push(iconType);
                }
                
                this.shuffleArray(icons);
                
                const gridContainer = document.getElementById('grid-container');
                gridContainer.innerHTML = '';
                gridContainer.style.gridTemplateColumns = `repeat(${this.gridSize}, 1fr)`;
                
                let iconIndex = 0;
                for (let y = 0; y < this.gridSize; y++) {
                    this.grid[y] = [];
                    for (let x = 0; x < this.gridSize; x++) {
                        const iconType = icons[iconIndex++];
                        const item = { x, y, iconType, eliminated: false, selected: false };
                        this.grid[y][x] = item;
                        
                        const div = document.createElement('div');
                        div.className = 'grid-item';
                        div.dataset.x = x;
                        div.dataset.y = y;
                        div.textContent = this.iconTypes[iconType];
                        div.onclick = () => this.handleItemClick(x, y);
                        
                        gridContainer.appendChild(div);
                    }
                }
            }

            shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            handleItemClick(x, y) {
                if (!this.isPlaying) return;
                
                const item = this.grid[y][x];
                if (item.eliminated) return;
                
                if (this.selectedItem === null) {
                    item.selected = true;
                    this.selectedItem = item;
                    this.updateItemUI(x, y);
                } else if (this.selectedItem === item) {
                    item.selected = false;
                    this.selectedItem = null;
                    this.updateItemUI(x, y);
                } else {
                    if (this.tryEliminate(this.selectedItem, item)) {
                        this.selectedItem = null;
                    } else {
                        this.selectedItem.selected = false;
                        this.updateItemUI(this.selectedItem.x, this.selectedItem.y);
                        item.selected = true;
                        this.selectedItem = item;
                        this.updateItemUI(x, y);
                    }
                }
            }

            tryEliminate(item1, item2) {
                if (item1.iconType !== item2.iconType) {
                    return false;
                }
                
                if (!this.isAdjacent(item1, item2)) {
                    return false;
                }
                
                item1.eliminated = true;
                item2.eliminated = true;
                item1.selected = false;
                item2.selected = false;
                
                this.updateItemUI(item1.x, item1.y);
                this.updateItemUI(item2.x, item2.y);
                
                this.eliminatedPairs++;
                this.updateUI();
                
                if (this.checkWin()) {
                    this.winGame();
                }
                
                return true;
            }

            isAdjacent(item1, item2) {
                const dx = Math.abs(item1.x - item2.x);
                const dy = Math.abs(item1.y - item2.y);
                return (dx <= 1 && dy <= 1) && !(dx === 0 && dy === 0);
            }

            updateItemUI(x, y) {
                const item = this.grid[y][x];
                const div = document.querySelector(`.grid-item[data-x="${x}"][data-y="${y}"]`);
                
                if (item.eliminated) {
                    div.classList.add('eliminated');
                } else if (item.selected) {
                    div.classList.add('selected');
                } else {
                    div.classList.remove('selected');
                }
            }

            updateUI() {
                document.getElementById('current-level').textContent = `第 ${this.currentLevel} 关`;
                document.getElementById('timer').textContent = `⏱️ ${this.timeLeft}`;
                document.getElementById('target-pairs').textContent = `${this.targetPairs} 对`;
                document.getElementById('progress').textContent = `${this.eliminatedPairs}/${this.targetPairs}`;
                document.getElementById('game-coins').textContent = `💎 ${this.data.coins}`;
                
                document.getElementById('tips-count').textContent = this.data.props.tips;
                document.getElementById('remove-count').textContent = this.data.props.remove;
                document.getElementById('addtime-count').textContent = this.data.props.addtime;
                
                document.getElementById('prop-tips').classList.toggle('disabled', this.data.props.tips <= 0);
                document.getElementById('prop-remove').classList.toggle('disabled', this.data.props.remove <= 0);
                document.getElementById('prop-addtime').classList.toggle('disabled', this.data.props.addtime <= 0);
            }

            updateCoinsDisplay() {
                const totalCoinsEl = document.getElementById('total-coins');
                if (totalCoinsEl) {
                    totalCoinsEl.textContent = `💎 ${this.data.coins}`;
                }
            }

            startTimer() {
                if (this.timer) clearInterval(this.timer);
                
                this.timer = setInterval(() => {
                    this.timeLeft--;
                    document.getElementById('timer').textContent = `⏱️ ${this.timeLeft}`;
                    
                    if (this.timeLeft <= 0) {
                        this.loseGame();
                    }
                }, 1000);
            }

            stopTimer() {
                if (this.timer) {
                    clearInterval(this.timer);
                    this.timer = null;
                }
            }

            pauseGame() {
                this.isPlaying = false;
                this.stopTimer();
                document.getElementById('pause-modal').classList.add('active');
            }

            resumeGame() {
                this.closeModal('pause-modal');
                this.isPlaying = true;
                this.startTimer();
            }

            retryLevel() {
                this.closeModal('pause-modal');
                this.closeModal('fail-modal');
                this.startLevel(this.currentLevel);
            }

            quitToLevelSelect() {
                this.stopTimer();
                this.isPlaying = false;
                this.closeModal('pause-modal');
                this.closeModal('fail-modal');
                this.showLevelSelect();
            }

            checkWin() {
                return this.eliminatedPairs >= this.targetPairs;
            }

            winGame() {
                this.stopTimer();
                this.isPlaying = false;
                
                const usedTime = this.timeLimit - this.timeLeft;
                const stars = this.calculateStars(usedTime);
                
                if (!this.data.stars[this.currentLevel] || stars > this.data.stars[this.currentLevel]) {
                    this.data.stars[this.currentLevel] = stars;
                }
                
                if (this.currentLevel >= this.data.highestLevel) {
                    this.data.highestLevel = Math.min(this.currentLevel + 1, 100);
                }
                
                this.data.coins += 50 * stars;
                this.saveData();
                
                setTimeout(() => {
                    this.showResult(true, usedTime, stars);
                }, 500);
            }

            loseGame() {
                this.stopTimer();
                this.isPlaying = false;
                document.getElementById('fail-modal').classList.add('active');
            }

            calculateStars(usedTime) {
                const ratio = usedTime / this.timeLimit;
                if (ratio <= 0.5) return 3;
                if (ratio <= 0.8) return 2;
                return 1;
            }

            showResult(success, usedTime, stars) {
                const icon = document.getElementById('result-icon');
                const title = document.getElementById('result-title');
                const starsEl = document.getElementById('result-stars');
                const timeEl = document.getElementById('result-time');
                const ratingEl = document.getElementById('result-rating');
                
                if (success) {
                    icon.textContent = '🎉';
                    title.textContent = '通关成功！';
                    starsEl.textContent = '⭐'.repeat(stars);
                    timeEl.textContent = `${usedTime}秒`;
                    
                    const ratings = ['一般', '不错', '完美'];
                    ratingEl.textContent = ratings[stars - 1];
                    
                    document.getElementById('single-reward').textContent = 50 * stars;
                    document.getElementById('btn-double').style.display = 'block';
                } else {
                    icon.textContent = '😢';
                    title.textContent = '挑战失败';
                    starsEl.textContent = '💔';
                    timeEl.textContent = '-';
                    ratingEl.textContent = '-';
                    document.getElementById('btn-double').style.display = 'none';
                }
                
                this.showScene('result-scene');
            }

            claimReward() {
                this.showLevelSelect();
            }

            async claimDoubleReward() {
                this.showLoading();
                await this.simulateAd();
                this.hideLoading();
                alert('恭喜获得双倍奖励！');
                this.showLevelSelect();
            }

            async watchAdRevive() {
                this.closeModal('fail-modal');
                this.showLoading();
                
                await this.simulateAd();
                
                this.timeLeft = 30;
                this.isPlaying = true;
                this.startTimer();
                
                this.hideLoading();
            }

            nextLevel() {
                this.startLevel(this.currentLevel + 1);
            }

            useProp(type) {
                if (!this.isPlaying || this.data.props[type] <= 0) return;
                
                switch (type) {
                    case 'tips':
                        this.showHint();
                        break;
                    case 'remove':
                        this.removeRandomItem();
                        break;
                    case 'addtime':
                        this.addTime(30);
                        break;
                }
                
                this.data.props[type]--;
                this.saveData();
                this.updateUI();
            }

            showHint() {
                const hint = this.findHint();
                if (hint) {
                    const [item1, item2] = hint;
                    const div1 = document.querySelector(`.grid-item[data-x="${item1.x}"][data-y="${item1.y}"]`);
                    const div2 = document.querySelector(`.grid-item[data-x="${item2.x}"][data-y="${item2.y}"]`);
                    
                    div1.classList.add('hint');
                    div2.classList.add('hint');
                    
                    setTimeout(() => {
                        div1.classList.remove('hint');
                        div2.classList.remove('hint');
                    }, 1500);
                }
            }

            findHint() {
                for (let y = 0; y < this.gridSize; y++) {
                    for (let x = 0; x < this.gridSize; x++) {
                        const item = this.grid[y][x];
                        if (item.eliminated) continue;
                        
                        const adjacent = this.getAdjacentItems(item);
                        for (const adjItem of adjacent) {
                            if (!adjItem.eliminated && adjItem.iconType === item.iconType) {
                                return [item, adjItem];
                            }
                        }
                    }
                }
                return null;
            }

            getAdjacentItems(item) {
                const adjacent = [];
                for (let dy = -1; dy <= 1; dy++) {
                    for (let dx = -1; dx <= 1; dx++) {
                        if (dx === 0 && dy === 0) continue;
                        
                        const nx = item.x + dx;
                        const ny = item.y + dy;
                        
                        if (nx >= 0 && nx < this.gridSize && ny >= 0 && ny < this.gridSize) {
                            adjacent.push(this.grid[ny][nx]);
                        }
                    }
                }
                return adjacent;
            }

            removeRandomItem() {
                const available = [];
                for (let y = 0; y < this.gridSize; y++) {
                    for (let x = 0; x < this.gridSize; x++) {
                        if (!this.grid[y][x].eliminated) {
                            available.push(this.grid[y][x]);
                        }
                    }
                }
                
                if (available.length > 0) {
                    const randomIndex = Math.floor(Math.random() * available.length);
                    const item = available[randomIndex];
                    item.eliminated = true;
                    this.eliminatedPairs++;
                    this.updateItemUI(item.x, item.y);
                    this.updateUI();
                    
                    if (this.checkWin()) {
                        this.winGame();
                    }
                }
            }

            addTime(seconds) {
                this.timeLeft += seconds;
                this.updateUI();
            }

            closeModal(modalId) {
                document.getElementById(modalId).classList.remove('active');
            }

            showLoading() {
                document.getElementById('loading').classList.add('active');
            }

            hideLoading() {
                document.getElementById('loading').classList.remove('active');
            }

            async simulateAd() {
                return new Promise(resolve => {
                    alert('📺 正在加载广告（模拟）...');
                    setTimeout(() => {
                        alert('✅ 观看完成！');
                        resolve();
                    }, 2000);
                });
            }
        }

        const game = new EliminationGame();
    </script>
</body>
</html>
